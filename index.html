<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mevzuat Takip Sistemi</title>
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --ink:#16324A; --ink2:#2B4A63; --paper:#F5F7F8; --card:#FFFFFF; --line:#D8DFE3; --muted:#5E6E79;
  --a1:#3B5BB5; --a2:#12897A; --b:#B07A12; --c:#7A62AD;
  --devam:#2563A6; --bekle:#A8690F; --onay:#6B46C1; --arsiv:#6B7280; --gec:#B42318; --ok:#1E7B45;
  --focus:#1D6FD1;
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; color:var(--ink); background:var(--paper);
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink2)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header.top .brand{font-weight:700;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.bars{display:flex;gap:3px}.bars i{display:block;width:5px;height:18px;border-radius:2px}
header.top button{background:transparent;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:6px;position:relative}
header.top button:hover{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:0;right:0;background:var(--gec);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;min-width:18px;text-align:center}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 52px)}
nav.side{border-right:1px solid var(--line);padding:14px 8px;background:#EEF2F4}
nav.side a{display:block;padding:9px 12px;border-radius:7px;text-decoration:none;color:var(--ink);font-weight:500}
nav.side a.on{background:var(--ink);color:#fff}
nav.side .sep{height:1px;background:var(--line);margin:10px 6px}
main{padding:20px 24px 90px;max-width:1200px;width:100%}
nav.bottom{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.side{display:none}
  main{padding:14px 12px 90px}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:4px 0;font-weight:500}
  nav.bottom a.on{color:var(--ink);font-weight:700}
  nav.bottom a b{display:block;font-size:18px;line-height:1.2}
}
h1{font-size:24px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
h2{font-size:18px;margin:26px 0 10px;font-weight:700}
h3{font-size:15px;margin:18px 0 8px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.p:hover{background:var(--ink2)}
.btn.danger{color:var(--gec);border-color:#E7B7B2}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink2)}
input[type=text],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.err{color:var(--gec);font-size:13.5px;margin:6px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.b-devam{color:var(--devam)}.b-beklemede{color:var(--bekle)}.b-onay_uzman,.b-onay_yonetici{color:var(--onay)}.b-arsiv{color:var(--arsiv)}
.b-gec{color:#fff;background:var(--gec);border-color:var(--gec)}.b-cb{color:#fff;background:var(--ink2);border-color:var(--ink2)}
.b-gizli{color:var(--muted)}
.kat{display:inline-block;font-weight:700;font-size:12px;color:#fff;border-radius:4px;padding:1px 6px}
.k-A1{background:var(--a1)}.k-A2{background:var(--a2)}.k-B{background:var(--b)}.k-C{background:var(--c)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--ink)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}
@media (max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit;overflow:hidden}
.item:hover{border-color:var(--ink2)}
.item .spine{background:var(--line)}
.item .spine.A1{background:var(--a1)}.item .spine.A2{background:var(--a2)}.item .spine.B{background:var(--b)}.item .spine.C{background:var(--c)}
.item .body{padding:10px 0;min-width:0}
.item .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:13px;color:var(--muted);margin-top:3px}
.item .acik{font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .bek{font-size:13px;color:var(--ink2);margin-top:3px;padding-left:10px;border-left:2px solid var(--line)}
.item .uyari{font-size:13px;color:var(--gec);margin-top:5px;font-weight:500}
.item .r{padding:10px 12px 10px 0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:600px){.item{grid-template-columns:5px 1fr}.item .r{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;padding:0 12px 10px 0}}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
table.t th{background:#EEF2F4;font-size:13px;font-weight:700}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.dhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.dno{font-size:30px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:13.5px}.dl dd{margin:0}
@media (max-width:600px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
.tur{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
.tur .th{padding:10px 14px;background:#EEF2F4;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cev{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;padding:10px}
.cb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13.5px}
.cb .nm{flex:1;min-width:0}
.cb .nm small{display:block;color:var(--muted)}
.mark{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;border:1px dashed var(--muted);color:var(--muted);flex:none}
.mark.plus{background:var(--ok);color:#fff;border:0}.mark.minus{background:#DDE3E7;color:var(--ink);border:0}
.mark.late{border:1.5px solid var(--gec);color:var(--gec)}
.tl{list-style:none;padding:0;margin:0}
.tl li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl li small{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.kpi a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit}
.kpi a b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi a span{color:var(--muted);font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pick{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:4px}
.pick label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;font-size:14px}
.pick label:hover{background:#F0F4F6}
.pick .g{font-size:12px;font-weight:700;color:var(--muted);padding:8px 6px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
.login{max-width:420px;margin:12vh auto;padding:28px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}
.edit{border:1px dashed transparent;border-radius:5px;padding:2px 4px;min-height:1.4em}
.edit:hover{border-color:var(--line)}
.edit:focus{border-color:var(--focus);outline:none;background:#F7FBFF}
.edited{background:#FFF7E0}
.pre{white-space:pre-wrap;font-size:13.5px;background:#F6F8F9;border:1px solid var(--line);border-radius:8px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="login"><p>Yükleniyor…</p></div></div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, onSnapshot, query, where,
  runTransaction, serverTimestamp, writeBatch, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-fN9tZS4SHh2v3mF9NUpZgRPOst5SjnE",
  authDomain: "hhgm-is-takip.firebaseapp.com",
  projectId: "hhgm-is-takip",
  storageBucket: "hhgm-is-takip.firebasestorage.app",
  messagingSenderId: "587946016439",
  appId: "1:587946016439:web:c31ffc251faa9a45c75732"
};
const OWNER = "sacid1771@gmail.com";
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

/* ---------- sabitler ---------- */
const KATS = { A1:"Bakanlık Taslakları", A2:"A2 Taslaklar", B:"Dış Görüşler", C:"Diğer Yazılar" };
const DURUM = { devam:"Devam ediyor", beklemede:"Beklemede", onay_uzman:"Onay bekliyor (uzman yrd.)", onay_yonetici:"Onay bekliyor (yönetici)", arsiv:"Arşiv" };
const SONUC_AD = { "+":"Öneri var", "-":"Öneri yok", "0":"Cevap vermedi", "?":"Cevap geldi" };
const SONUC_ISARET = { "+":"+", "-":"−", "0":"∅", "?":"✓" };
const ROL = { atayan:"Atayan", uzman:"Uzman Yardımcısı", yonetici:"Yönetici", kurucu:"Sistem sahibi" };
const SONUC = ["Yürürlüğe girdi","Görüş bildirildi","İade edildi","Geri çekildi","Diğer"];
const NIHAI = { olurh:"Bakan Oluru hazırlandı", olur:"Bakan Oluru imzalandı", rg:"Resmî Gazete'de yayımlandı", yb:"Mevzuat yürürlük bildirimi yapıldı", tiade:"Taslak iade edildi", geri:"Taslak geri çekildi" };
const NIHAI_SON = ["yb","tiade","geri"];
const NIHAI_SIRA = { olurh:1, teklif:1, olur:2, rg:2, yb:3, tiade:4, geri:4 };
const ADIM_ESKI = { istem:"Görüş değerlendirme istemi gönderildi", form:"Görüş değerlendirme formu geldi", iade:"Görüş değerlendirme formu iade edildi" };
const ADIM = {
  kontrol:"Son kontrole gönderildi",
  raportor:"Raportör dönüşü"
};
const VARSAYILAN_TURLER = ["Kanun","Müstakil Cumhurbaşkanlığı Kararnamesi","Çerçeve Cumhurbaşkanlığı Kararnamesi","Cumhurbaşkanlığı Kararnamesi İlgası",
  "Müstakil Cumhurbaşkanı Kararı","Çerçeve Cumhurbaşkanı Kararı","Cumhurbaşkanı Kararı İlgası","Müstakil Yönetmelik","Çerçeve Yönetmelik","Yönetmelik İlgası",
  "Müstakil Tebliğ","Çerçeve Tebliğ","Tebliğ İlgası","Müstakil Yönerge","Çerçeve Yönerge","Yönerge İlgası","Müstakil Usul ve Esaslar","Çerçeve Usul ve Esaslar",
  "Usul ve Esaslar İlgası","Genelge","Genelge İlgası","Protokol","Standart","Rehber","Kılavuz","Eylem Planı","Diğer"];

/* ---------- durum ---------- */
const S = { user:null, email:"", me:null, role:null, users:{}, dosyalar:{}, arsiv:null, birimler:{}, hukukcular:{}, turler:[],
  sayac:{}, bildirimler:[], ekListeler:{}, unsub:[], ready:false };

/* ---------- yardımcılar ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const bugun = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const tarih = s => { if(!s) return ""; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]}.${+m[2]}.${m[1]}` : String(s); };
const simdi = () => new Date().toISOString();
const uid = () => Math.random().toString(36).slice(2,10);
const norm = s => String(s||"").toLocaleUpperCase("tr").replace(/Î/g,"I").replace(/Â/g,"A").replace(/Û/g,"U").replace(/^AV(\.\s*|\s+)/,"").replace(/\s+/g," ").trim();
const myName = () => S.gercek ? `${S.me?.ad} (deneme: ${S.gercek.me?.ad||"Sistem sahibi"})` : (S.me?.ad || S.user?.displayName || S.email);
const gercekSahip = () => (S.gercek?.email || S.email) === OWNER;
const userName = e => (e && S.users[e]?.ad) || e || "";
const isOwner = () => S.email === OWNER;
const isYon = () => isOwner() || S.role === "yonetici";
const isAtayan = () => S.role === "atayan";
const isMgr = () => isYon() || isAtayan();
const canEditAll = d => isYon() || (isAtayan() && d.durum !== "arsiv");
const canWork = d => canEditAll(d) || (d.atananEmail === S.email && d.durum !== "arsiv");
const aktifKullanicilar = rol => Object.values(S.users).filter(u => u.aktif && (!rol || u.rol === rol)).sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
const yoneticiler = () => aktifKullanicilar("yonetici").map(u=>u.email);

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function hata(e){ console.error(e); toast("İşlem kaydedilemedi: " + (e?.code==="permission-denied" ? "bu işlem için yetkiniz yok." : (e?.message||e))); }

function yonelme(ad){
  ad = String(ad||"").trim(); if(!ad) return "";
  const lo = ad.toLocaleLowerCase("tr"), V="aıoueiöü", B="aıou";
  let lv=""; for(let i=lo.length-1;i>=0;i--){ if(V.includes(lo[i])){lv=lo[i];break;} }
  const son = lo.slice(-1), once = lo.slice(-2,-1);
  const kisa = ad === ad.toLocaleUpperCase("tr") && !ad.includes(" ");
  if(kisa){
    if(!V.includes(son) && !V.includes(once)) return ad+"'ye";
    return ad+"'"+(V.includes(son)?"y":"")+(B.includes(lv)?"a":"e");
  }
  const ek = B.includes(lv) ? "a" : "e";
  if(V.includes(son)) return ad + (ad.includes(" ") && "ıiuü".includes(son) ? "n" : "y") + ek;
  return ad + ek;
}

/* son tarih yardımcıları */
const etkinSon = (tur, b) => b.ekSure || tur.sonTarih || "";
function acikBirimler(d){
  const out=[];
  (d.turlar||[]).forEach(t => (t.birimler||[]).forEach(b => { if(!b.sonuc) out.push({tur:t, b, son:etkinSon(t,b)}); }));
  return out;
}
function gecikme(d){
  const bg = bugun(); let gec=0, bugunSon=0;
  acikBirimler(d).forEach(x => { if(x.son && x.son < bg) gec++; else if(x.son===bg) bugunSon++; });
  const cevapGec = d.durum!=="arsiv" && d.cevapSonTarih && d.cevapSonTarih < bg;
  return { gec, bugunSon, cevapGec, var: gec>0 || cevapGec };
}

/* ---------- rapor metni (otomatik) ---------- */
function olaylar(d){
  const ev = [{tip:"acilis", tarih:d.gelisTarihi||"", sira:0}];
  (d.turlar||[]).forEach((t,i)=>ev.push({tip:"tur", tarih:t.tarih||"", tur:t, sira:1000+i, id:t.id}));
  (d.adimlar||[]).forEach((a,i)=>ev.push({tip:a.tip, tarih:a.tarih||"", adim:a, sira:(a.tip==="raportor"?2420:2000)+i, id:a.id}));
  (d.sonucAdim||[]).forEach((x,i)=>ev.push({tip:x.tip, tarih:x.tarih||"", adim:{ birim:d.birimAd, barkod:x.sayi, sayi:x.sayi }, sira:2500+(NIHAI_SIRA[x.tip]||0)*20+i, id:x.id}));
  (d.kategori==="A1" ? (d.gdf||[]) : []).forEach((g,i)=>ev.push({tip:g.tip, tarih:g.tarih||"", adim:{ birim:d.birimAd, barkod:g.sayi }, sira:1500+i, id:g.id}));
  if(d.cb?.isaret) ev.push({tip:"cb", tarih:d.cb.tarih||"", sira:2400});
  ev.sort((a,b)=> (a.tarih||"").localeCompare(b.tarih||"") || a.sira-b.sira);
  let iadeVar = false; ev.forEach(e => { if(e.tip==="iade") iadeVar = true; else if(e.tip==="form" && iadeVar) e.revize = true; else if(e.tip==="istem") iadeVar = false; });
  return ev;
}
const olayAnahtar = d => { const ev = olaylar(d); const l = ev[ev.length-1]; return `${ev.length}|${l.tip}|${l.id||""}|${l.tarih}`; };
function gdfListe(d){
  const l = [...(d.gdf||[]).map(g=>({ ...g, kaynak:"gdf" })),
    ...(d.adimlar||[]).filter(a=>["istem","form","iade"].includes(a.tip)).map(a=>({ id:a.id, tip:a.tip, tarih:a.tarih, sayi:a.barkod, not:a.not, ekleyen:a.ekleyen, kaynak:"adim" }))];
  l.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"") || (a.zaman||"").localeCompare(b.zaman||""));
  let iade = false; l.forEach(g => { if(g.tip==="iade") iade = true; else if(g.tip==="form" && iade){ g.revize = true; iade = false; } else if(g.tip==="istem") iade = false; });
  return l;
}
function gdfDurum(d){
  const l = gdfListe(d); if(!l.length) return null; const son = l[l.length-1];
  if(son.tip==="istem" || son.tip==="iade") return { bekleniyor:true, tarih:son.tarih, metin:`${son.tip==="iade"?"Revize form":"Form"} bekleniyor (${tarih(son.tarih)} tarihinden beri)` };
  return { bekleniyor:false, tarih:son.tarih, metin:`${son.revize?"Revize form":"Form"} geldi (${tarih(son.tarih)})` };
}
const GDF_AD = g => g.tip==="istem" ? "İstem gönderildi" : g.tip==="iade" ? "Form iade edildi" : (g.revize ? "Revize form geldi" : "Form geldi");
function olayMetni(d, e){
  const t = tarih(e.tarih);
  switch(e.tip){
    case "acilis": return { a:`Taslak ${t} tarihinde Genel Müdürlüğümüze gönderildi.`, b:"İnceleniyor." };
    case "tur": {
      const bl = e.tur.birimler||[]; const tip = e.tur.tip==="dis" ? "dış görüşe" : "iç görüşe";
      const hepsi = bl.length && bl.every(b=>b.sonuc);
      let a = bl.length && bl.length<=3
        ? `${t} tarihinde ${bl.map(b=>b.kisa||b.ad).join(", ")} görüşüne açıldı.`
        : `${t} tarihinde ${tip} açıldı.`;
      if(e.tur.sonTarih) a = a.replace(/\.$/, `, ${tarih(e.tur.sonTarih)} tarihine kadar süre verildi.`);
      if(hepsi) return { a: a+" Görüş süreci tamamlandı.", b: d.kategori==="A1" ? "Görüş değerlendirme istemi hazırlanıyor." : d.kategori==="B" ? "Bakanlık görüşü hazırlanıyor." : d.kategori==="A2" ? "Genel Müdürlüğümüz görüşü hazırlanıyor." : "Cevap yazısı hazırlanıyor." };
      return { a, b:"" };
    }
    case "istem": return { a:`Görüş değerlendirme istemi ${t} tarihinde ${yonelme(e.adim.birim||d.birimAd)} gönderildi.`, b:"Görüş değerlendirme formunun Genel Müdürlüğümüze gönderilmesi bekleniyor." };
    case "form": return { a:`${e.revize?"Revize görüş değerlendirme formu":"Görüş değerlendirme formu"} ${t} tarihinde Genel Müdürlüğümüze gönderildi.`, b:"Taslağa nihai hali veriliyor." };
    case "iade": return { a:`Görüş değerlendirme formu ${t} tarihinde ${yonelme(e.adim.birim||d.birimAd)} iade edildi.`, b:"Görüş değerlendirme formunun revize edilerek Genel Müdürlüğümüze gönderilmesi bekleniyor." };
    case "kontrol": return { a:`Nihai taslak ${t} tarihinde son kontrol için ${yonelme(e.adim.birim||d.birimAd)} gönderildi.`, b:"Son kontrol neticesi bekleniyor." };
    case "raportor": return { a:`Raportör dönüşü (${t}): ${e.adim.not||""}`.trim(), b:"" };
    case "olurh": return { a:`Bakan Oluru ${t} tarihinde hazırlanarak imzaya sunuldu.`, b:"Bakan Olurunun imzalanması bekleniyor." };
    case "olur": return { a:`Bakan Oluru ${t} tarih ve ${e.adim.sayi||"…"} sayı ile imzalandı.`, b:"Mevzuat yürürlük bildirimi bekleniyor." };
    case "rg": return { a:`${t} tarihli ve ${e.adim.sayi||"…"} sayılı Resmî Gazete'de yayımlandı.`, b:"Mevzuat yürürlük bildirimi bekleniyor." };
    case "yb": return { a:`Mevzuat yürürlük bildirimi ${t} tarihinde yapıldı.`, b:"Arşiv işlemleri bekleniyor." };
    case "tiade": return { a:`Taslak ${t} tarihinde ${yonelme(d.birimAd)} iade edildi.`, b:"Arşiv işlemleri bekleniyor." };
    case "geri": return { a:`Taslak ${t} tarihinde geri çekildi.`, b:"Arşiv işlemleri bekleniyor." };
    case "cb": return { a:`${t} tarihli ve ${d.cb?.sayi||"…"} sayılı yazı ile Cumhurbaşkanlığına gönderildi.`, b:"Raportör incelemesinde." };
  }
  return { a:"", b:"" };
}
function bekleyenSatiri(d){
  const out = [];
  (d.turlar||[]).forEach(t => {
    const ac = (t.birimler||[]).filter(b=>!b.sonuc);
    if(!ac.length) return;
    const adlar = ac.map(b => (b.kisa||b.ad) + (b.ekSure ? ` (ek süre: ${tarih(b.ekSure)})` : ""));
    out.push(`Cevap bekleniyor: ${adlar.join(", ")}${t.sonTarih?` (son tarih ${tarih(t.sonTarih)})`:""}`);
  });
  return out.join("\n");
}
function otoMetin(d){
  const ev = olaylar(d); const son = ev[ev.length-1];
  let {a, b} = olayMetni(d, son);
  if(d.durum==="beklemede" && d.beklemeGerekce) b = d.beklemeGerekce;
  if(d.cb?.isaret && son.tip!=="cb") { /* CB sonrası gelişme */ }
  const bek = bekleyenSatiri(d);
  if(bek) b = b ? b+"\n"+bek : bek;
  return { aciklama:a, beklenen:b };
}
function raporMetni(d){
  const o = otoMetin(d); const r = d.raporDuzeltme;
  if(r && r.anahtar === olayAnahtar(d)) return { aciklama: r.aciklama ?? o.aciklama, beklenen: r.beklenen ?? o.beklenen, duzeltildi:true, oto:o };
  return { ...o, duzeltildi:false, oto:o };
}

function dinle(){
  const u = S.unsub, hazir = new Set(), gerekli = ["k","d","b","h","a","s","n","e"];
  const tamam = k => { hazir.add(k); if(!S.ready && gerekli.every(x=>hazir.has(x))){ S.ready=true; iskelet(); ciz(); } else if(S.ready) cizCanli(); };
  const hataDinle = k => e => { console.error(k,e); tamam(k); };
  u.push(onSnapshot(collection(db,"kullanicilar"), s => { S.users={}; s.forEach(x=>S.users[x.id]={email:x.id,...x.data()}); tamam("k"); }, hataDinle("k")));
  u.push(onSnapshot(query(collection(db,"dosyalar"), where("durum","!=","arsiv")), s => {
    S.dosyalar={}; s.forEach(x=>S.dosyalar[x.id]={id:x.id,...x.data()});
    if(S.arsiv){ Object.keys(S.dosyalar).forEach(id=>delete S.arsiv[id]); }
    s.docChanges().forEach(ch => { if(ch.type==="removed" && S.arsiv) S.arsiv=null; });
    tamam("d"); }, hataDinle("d")));
  u.push(onSnapshot(collection(db,"birimler"), s => { S.birimler={}; s.forEach(x=>S.birimler[x.id]={id:x.id,...x.data()}); tamam("b"); }, hataDinle("b")));
  u.push(onSnapshot(collection(db,"hukukcular"), s => { S.hukukcular={}; s.forEach(x=>S.hukukcular[x.id]={id:x.id,...x.data()}); tamam("h"); }, hataDinle("h")));
  u.push(onSnapshot(doc(db,"ayarlar","genel"), s => { S.turler = (s.exists() && s.data().turler?.length) ? s.data().turler : VARSAYILAN_TURLER; tamam("a"); }, hataDinle("a")));
  u.push(onSnapshot(collection(db,"sayaclar"), s => { S.sayac={}; s.forEach(x=>S.sayac[x.id]=x.data().son||0); tamam("s"); }, hataDinle("s")));
  S.bildirimDinle = () => { if(S.bUnsub) S.bUnsub(); if(S.bUnsub2) S.bUnsub2(); S.bUnsub2 = null;
    let asil = [], deneme = [];
    const birlestir = () => { S.bildirimler = [...asil, ...deneme].sort((a,b)=>(b.zaman?.seconds||0)-(a.zaman?.seconds||0)); tamam("n"); };
    S.bUnsub = onSnapshot(query(collection(db,"bildirimler"), where("alici","==",S.email)), s => {
      asil = []; s.forEach(x=>asil.push({id:x.id,...x.data()})); birlestir(); }, hataDinle("n"));
    if(S.gercek) S.bUnsub2 = onSnapshot(query(collection(db,"bildirimler"), where("alici","==",OWNER)), s => {
      deneme = []; s.forEach(x=>{ const b = x.data(); if(b.deneme && (b.hedefler||[]).includes(S.email)) deneme.push({id:x.id,...b}); }); birlestir(); }, hataDinle("n"));
  };
  S.bildirimDinle(); u.push(() => { S.bUnsub && S.bUnsub(); S.bUnsub2 && S.bUnsub2(); });
  u.push(onSnapshot(collection(db,"ekListeler"), s => { S.ekListeler={}; s.forEach(x=>S.ekListeler[x.id]={id:x.id,...x.data()}); tamam("e"); }, hataDinle("e")));
}

function nihaiListe(d){
  const l = (d.sonucAdim||[]).map(x=>({ ...x, ad:NIHAI[x.tip] }));
  if(d.cb?.isaret) l.push({ id:"cb", tip:"teklif", tarih:d.cb.tarih||"", sayi:d.cb.sayi||"", not:d.cb.not||"", ad:"Teklif yazısı ile Cumhurbaşkanlığına gönderildi" });
  return l.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"") || (NIHAI_SIRA[a.tip]||0)-(NIHAI_SIRA[b.tip]||0) || (a.zaman||"").localeCompare(b.zaman||""));
}
const ybBekliyor = d => d.kategori==="A1" && ["devam","beklemede"].includes(d.durum) && (d.sonucAdim||[]).some(x=>x.tip==="olur"||x.tip==="rg") && !(d.sonucAdim||[]).some(x=>NIHAI_SON.includes(x.tip));
const nihaiBitti = d => (d.sonucAdim||[]).some(x=>NIHAI_SON.includes(x.tip));
function nihaiHtml(d, ew){
  const l = nihaiListe(d), bitti = nihaiBitti(d), var_ = t => (d.sonucAdim||[]).some(x=>x.tip===t);
  const olurYolu = var_("olurh") || var_("olur"), teklifYolu = !!d.cb?.isaret;
  const yururlukte = var_("olur") || var_("rg");
  const btn = [];
  if(ew && !bitti){
    if(!olurYolu && !teklifYolu) btn.push(`<button class="btn" data-x="nihai" data-tip="olurh">Bakan Oluru hazırlandı</button>`, `<button class="btn" data-x="cb">Teklif yazısı gönderildi</button>`);
    if(olurYolu && !var_("olur")) btn.push(`<button class="btn p" data-x="nihai" data-tip="olur">Bakan Oluru imzalandı</button>`);
    if(teklifYolu && !var_("rg")) btn.push(`<button class="btn p" data-x="nihai" data-tip="rg">Resmî Gazete'de yayımlandı</button>`);
    if(yururlukte) btn.push(`<button class="btn p" data-x="nihai" data-tip="yb">Mevzuat yürürlük bildirimi yapıldı</button>`);
    btn.push(`<button class="btn" data-x="nihai" data-tip="tiade">İade edildi</button>`, `<button class="btn" data-x="nihai" data-tip="geri">Geri çekildi</button>`);
  }
  return `<div class="panel">
    ${bitti && ["devam","beklemede"].includes(d.durum) ? `<p style="margin-top:0;color:var(--onay)"><b>Dosya arşiv işlemleri için bekliyor.</b>${isMgr()?" Kontrol edip yukarıdan \"Tamamlandı\" diyebilirsiniz.":""}</p>` : ""}
    ${l.length ? `<ul class="tl">${l.map(x=>`<li><b>${esc(x.ad)}</b> – ${tarih(x.tarih)||"tarih girilmedi"}${x.sayi?` – <span class="num">${esc(x.sayi)}</span>`:""}${x.not?`<br>${esc(x.not)}`:""}
      ${x.tip==="teklif" && !x.sayi && ew ? ` <button class="btn sm" data-x="cb">Tarih ve sayıyı gir</button>` : ""}
      ${ew ? ` <button class="btn sm" data-x="${x.tip==="teklif"?"cb":"nihaiduz"}" data-id="${x.id}">Düzelt</button> <button class="btn sm danger" data-x="nihaisil" data-id="${x.id}">Sil</button>` : ""}</li>`).join("")}</ul>` : `<p class="sub" style="margin-top:0">Henüz nihai işlem yok.</p>`}
    ${btn.length?`<div class="row" style="margin-top:10px">${btn.join("")}</div>`:""}</div>`;
}
function gdfHtml(d, ew){
  const l = gdfListe(d), du = gdfDurum(d); const son = l[l.length-1];
  const btn = [];
  if(ew){
    if(!son || son.tip==="form") btn.push(`<button class="btn ${son?"":"p"}" data-x="gdfekle" data-tip="istem">${son?"Yeni istem gönder":"İstem gönder"}</button>`);
    if(son && son.tip!=="form") btn.push(`<button class="btn p" data-x="gdfekle" data-tip="form">${son.tip==="iade"?"Revize form geldi":"Form geldi"}</button>`);
    if(son && son.tip==="form") btn.push(`<button class="btn" data-x="gdfekle" data-tip="iade">Form iade edildi</button>`);
  }
  return `<div class="panel">
    <p style="margin-top:0"><b>${du ? esc(du.metin) : "İstem gönderilmedi"}</b>${d.birimAd?` <span class="sub">· Karşı taraf: ${esc(d.birimAd)}</span>`:""}</p>
    ${l.length ? `<ul class="tl">${l.map(g=>`<li><b>${GDF_AD(g)}</b> – ${tarih(g.tarih)}${g.sayi?` – <span class="num">${esc(g.sayi)}</span>`:""}${g.not?`<br>${esc(g.not)}`:""}<br><small>${esc(g.ekleyen||"")}</small>

    ${btn.length?`<div class="row" style="margin-top:10px">${btn.join("")}</div>`:""}</div>`;

function turHtml(d,t,ew){

    <span>${cev}/${top} cevap</span><span class="sp"></span>${ew?`<button class="btn sm" data-x="turbirim" data-id="${t.id}">Yer ekle</button>`:""}</div>

      <span class="nm">${esc(b.kisa?`${b.kisa}`:b.ad)}<small>${b.kisa?esc(b.ad)+" · ":""}${b.sonuc?`${SONUC_AD[b.sonuc]||""} ${esc(b.barkod||"")} ${tarih(b.tarih)}`:(b.ekSure?`Ek süre: ${tarih(b.ekSure)}`:gec?"Süresi geçti":"Bekleniyor")}</small></span>
      ${ew?`<button class="btn sm" data-x="cevap" data-id="${t.id}" data-i="${i}">${b.sonuc?"Düzelt":"İşle"}</button>`:""}</div>`; }).join("")}</div></div>`;

    m.querySelector("[data-sil]").onclick = async () => { if(!confirm(`${b.ad} bu turdan çıkarılsın mı?`)) return;
      const turlar = d.turlar.map(x => x.id!==t.id ? x : { ...x, birimler: x.birimler.filter((_,j)=>j!==+ds.i) });
      try{ await dosyaGuncelle(d, { turlar }, `${b.ad} görüş turundan çıkarıldı`); await turBittiBildir(d, t, turlar.find(x=>x.id===t.id)); kapat(); }catch(x){ hata(x); } };
    m.querySelector("[data-ok]").onclick = async () => { const v = fd(m);
      if(v.s && v.s!=="0" && !v.bk.trim() && !confirm("Barkod girmeden kaydedilsin mi?")) return;

      const olay = v.s ? `${b.ad}: ${(SONUC_AD[v.s]||"").toLocaleLowerCase("tr")}${v.bk?` (${v.bk.trim()})`:""}` : (v.ek!==(b.ekSure||"") ? `${b.ad}: ek süre ${tarih(v.ek)||"kaldırıldı"}` : `${b.ad} güncellendi`);
      try{ await dosyaGuncelle(d, { turlar }, olay); await turBittiBildir(d, t, turlar.find(x=>x.id===t.id)); kapat(); }catch(x){ hata(x); } };
  },
  adimekle(d){
    const m = modal(`<h2>Süreç adımı ekle</h2><form>
      <label class="f"><span>Adım</span><select name="tip" id="at">${Object.entries(ADIM).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>

      <label class="f" id="ab"><span>İlgili birim</span><input type="text" name="birim" list="bl" value="${esc(d.birimAd||"")}"><datalist id="bl">${birimListesi().map(b=>`<option value="${esc(b.ad)}">`).join("")}</datalist></label>
      <label class="f" id="an" hidden><span>Raportör dönüşü açıklaması</span><textarea name="not"></textarea></label></form>
      <div class="foot"><button class="btn" data-k>Vazgeç</button><button class="btn p" data-ok>Ekle</button></div>`);
    const at = m.querySelector("#at"); const upd = () => { const r = at.value==="raportor"; m.querySelector("#an").hidden=!r; m.querySelector("#ab").hidden = at.value==="form"||r; };
    at.onchange = upd; upd();
    m.querySelector("[data-k]").onclick=kapat;
    m.querySelector("[data-ok]").onclick = async () => { const v = fd(m);
      if(v.tip==="raportor" && !v.not?.trim()) return toast("Raportör dönüşünün açıklamasını yazın.");
      const a = { id:uid(), tip:v.tip, tarih:v.tarih, barkod:(v.barkod||"").trim(), birim:["form","raportor"].includes(v.tip)?"":(v.birim||"").trim(), not:(v.not||"").trim(), ekleyen:myName(), zaman:simdi() };
      try{ await dosyaGuncelle(d, { adimlar:[...(d.adimlar||[]), a] }, `Adım eklendi: ${ADIM[v.tip]} (${tarih(v.tarih)})`); kapat(); }catch(x){ hata(x); } };

  nihai(d, ds){

      ${NIHAI_SON.includes(ds.tip)?`<p class="hint">Kaydedince yöneticilere, Atayan'a ve dosyanın uzman yardımcısına "Dosya arşiv işlemleri için bekliyor" bildirimi gider.</p>`:""}

        if(son) await bildir([...yoneticiler(), ...aktifKullanicilar("atayan").map(u=>u.email), d.atananEmail], "Dosya arşiv işlemleri için bekliyor", `${d.dosyaNo} – ${d.ad}\n${bas} (${tarih(v.t)})`, d.id);

    const x = (d.sonucAdim||[]).find(y=>y.id===ds.id); if(!x || !confirm(`"${NIHAI[x.tip]} – ${tarih(x.tarih)}" kaydı silinsin mi?`)) return;
    const kalan = d.sonucAdim.filter(y=>y.id!==ds.id);
    try{ await dosyaGuncelle(d, { sonucAdim:kalan, arsivBekliyor: kalan.some(y=>NIHAI_SON.includes(y.tip)) }, `Nihai işlem kaydı silindi: ${NIHAI[x.tip]} (${tarih(x.tarih)})`); }catch(e){ hata(e); }

  gdfekle(d, ds){
    const bas = { istem:"Görüş değerlendirme istemi gönder", form:"Görüş değerlendirme formu geldi", iade:"Görüş değerlendirme formu iade edildi" }[ds.tip];

      <div class="grid2"><label class="f"><span>Yazının tarihi</span><input type="date" name="t" value="${bugun()}" required></label>
      <label class="f"><span>Yazının sayısı / barkodu</span><input type="text" name="s"></label></div>
      <label class="f"><span>Açıklama (isteğe bağlı)</span><textarea name="n" style="min-height:50px"></textarea></label></form>
      <div class="foot"><button class="btn" data-k>Vazgeç</button><button class="btn p" data-ok>Kaydet</button></div>`);
    m.querySelector("[data-k]").onclick = kapat;
    m.querySelector("[data-ok]").onclick = async () => { const v = fd(m); if(!v.t) return toast("Tarih gerekli.");
      if(!v.s.trim() && !confirm("Sayı girmeden kaydedilsin mi?")) return;
      const g = { id:uid(), tip:ds.tip, tarih:v.t, sayi:v.s.trim(), not:(v.n||"").trim(), ekleyen:myName(), zaman:simdi() };
      try{ await dosyaGuncelle(d, { gdf:[...(d.gdf||[]), g] }, `${bas} (${tarih(v.t)}${v.s.trim()?", "+v.s.trim():""})`); kapat(); }catch(x){ hata(x); } };
  },
  gdfduz(d, ds){
    const g = gdfListe(d).find(x=>x.id===ds.id); if(!g) return;
    kayitDuzeltModal(`${GDF_AD(g)} – düzelt`, g, true, async v => {
      const patch = g.kaynak==="adim"
        ? { adimlar:(d.adimlar||[]).map(a => a.id!==g.id ? a : { ...a, tarih:v.t, barkod:v.s, not:v.n }) }
        : { gdf:(d.gdf||[]).map(x => x.id!==g.id ? x : { ...x, tarih:v.t, sayi:v.s, not:v.n }) };
      await dosyaGuncelle(d, patch, `Görüş değerlendirme kaydı düzeltildi: ${GDF_AD(g)} (${tarih(v.t)}${v.s?", "+v.s:""})`);
    });
  },
  nihaiduz(d, ds){
    const x = (d.sonucAdim||[]).find(y=>y.id===ds.id); if(!x) return;
    kayitDuzeltModal(`${NIHAI[x.tip]} – düzelt`, x, x.tip!=="olurh", async v => {
      await dosyaGuncelle(d, { sonucAdim:d.sonucAdim.map(y => y.id!==x.id ? y : { ...y, tarih:v.t, sayi:v.s, not:v.n }) }, `Nihai işlem düzeltildi: ${NIHAI[x.tip]} (${tarih(v.t)}${v.s?", "+v.s:""})`);
    });
  },
  async gdfsil(d, ds){
    const g = gdfListe(d).find(x=>x.id===ds.id); if(!g || !confirm(`"${GDF_AD(g)} – ${tarih(g.tarih)}" kaydı silinsin mi?`)) return;
    const patch = ds.k==="adim" ? { adimlar:(d.adimlar||[]).filter(a=>a.id!==g.id) } : { gdf:(d.gdf||[]).filter(x=>x.id!==g.id) };
    try{ await dosyaGuncelle(d, patch, `Görüş değerlendirme kaydı silindi: ${GDF_AD(g)} (${tarih(g.tarih)})`); }catch(x){ hata(x); }
  },
  async adimsil(d, ds){ const a = (d.adimlar||[]).find(x=>x.id===ds.id); if(!a || !confirm(`"${(ADIM[a.tip]||ADIM_ESKI[a.tip])}" adımı silinsin mi?`)) return;
    try{ await dosyaGuncelle(d, { adimlar:d.adimlar.filter(x=>x.id!==ds.id) }, `Adım silindi: ${(ADIM[a.tip]||ADIM_ESKI[a.tip])} (${tarih(a.tarih)})`); }catch(x){ hata(x); } }
};
async function turBittiBildir(d, eskiTur, yeniTur){
  const bitti = t => (t?.birimler||[]).length > 0 && t.birimler.every(b=>b.sonuc);
  if(bitti(eskiTur) || !bitti(yeniTur)) return;
  const bl = yeniTur.birimler, arti = bl.filter(b=>b.sonuc==="+").length;
  await bildir([d.atananEmail, ...yoneticiler()], "Görüş süreci tamamlandı",
    `${d.dosyaNo} – ${d.ad}\n${yeniTur.tip==="dis"?"Dış":"İç"} görüş turu (${tarih(yeniTur.tarih)}): ${bl.length} yerin tamamı cevaplandı, ${arti} yerden öneri geldi.`, d.id);
}

    <div class="grid2"><label class="f"><span>Tarih</span><input type="date" name="t" value="${esc(k.tarih||"")}" required></label>
    ${sayiVar?`<label class="f"><span>Sayı / barkod</span><input type="text" name="s" value="${esc(k.sayi||k.barkod||"")}"></label>`:`<input type="hidden" name="s" value="">`}</div>
    <label class="f"><span>Açıklama (isteğe bağlı)</span><textarea name="n" style="min-height:50px">${esc(k.not||"")}</textarea></label></form>
    <div class="foot"><button class="btn" data-k>Vazgeç</button><button class="btn p" data-ok>Kaydet</button></div>`);
  m.querySelector("[data-k]").onclick = kapat;
  m.querySelector("[data-ok]").onclick = async () => { const v = fd(m); if(!v.t) return toast("Tarih gerekli.");

}

}
function turModal(d, mevcut){
  const secili = new Set((mevcut?.birimler||[]).map(b=>b.key));
  const kaynak = [...birimListesi().map(b=>({key:b.id, ad:b.ad, kisa:b.kisaltma||"", grup:b.tur==="dis"?"Dış kurumlar":b.tur==="ic"?"İç birimler":"Diğer"})),
    ...Object.values(S.hukukcular).map(h=>({key:"h:"+h.id, ad:h.ad, kisa:"", grup:"Hukukçular"}))];
  const gruplar = ["İç birimler","Dış kurumlar","Hukukçular","Diğer"];
  const liste = () => gruplar.map(g => { const l = kaynak.filter(x=>x.grup===g).sort((a,b)=>a.ad.localeCompare(b.ad,"tr")); if(!l.length) return "";
    return `<div class="g" data-g="${g}">${g}</div>` + l.map(x=>`<label data-gr="${g}"><input type="checkbox" value="${esc(x.key)}" ${secili.has(x.key)?"checked disabled":""}> ${esc(x.ad)}${x.kisa?` <small class="sub">(${esc(x.kisa)})</small>`:""}</label>`).join(""); }).join("");
  const m = modal(`<h2>${mevcut?"Görüş turuna yer ekle":"Görüşe aç"}</h2><form>
    ${mevcut?"":`<div class="grid2"><label class="f"><span>Tür</span><select name="tip" id="tt"><option value="ic">İç görüş</option><option value="dis" ${d.kategori==="B"?"selected":""}>Dış görüş</option></select></label>
    <label class="f"><span>Görüş istem yazısının barkodu</span><input type="text" name="barkod" required></label>
    <label class="f"><span>Yazı tarihi</span><input type="date" name="tarih" value="${bugun()}" required></label>
    <label class="f"><span>Son tarih</span><input type="date" name="son" required></label></div>`}
    <span style="font-size:13px;font-weight:600">Görüşe açılan yerler</span>
    <div class="row" style="margin:4px 0 6px"><input type="search" id="ta" placeholder="Ara" style="flex:1"><label class="row" style="font-size:13px"><input type="checkbox" id="tg"> Diğer grupları da göster</label></div>
    <div class="pick" id="tp">${liste()}</div>
    <details style="margin-top:10px"><summary>Listede olmayan bir yer ekle</summary>
      <div class="grid2" style="margin-top:8px"><label class="f"><span>Adı</span><input type="text" id="ya"></label><label class="f"><span>Kısaltma</span><input type="text" id="yk"></label></div>
      <label class="f"><span>Türü</span><select id="yt"><option value="ic">İç birim</option><option value="dis">Dış kurum</option><option value="hukukcu">Hukukçu</option></select></label>
      <button type="button" class="btn sm" id="yekle">Listeye ekle ve işaretle</button></details>
  </form><div class="foot"><button class="btn" data-k>Vazgeç</button><button class="btn p" data-ok>${mevcut?"Ekle":"Görüşe aç"}</button></div>`);
  const tt = m.querySelector("#tt"), tg = m.querySelector("#tg"), ta = m.querySelector("#ta");
  const suz = () => { const tip = mevcut ? mevcut.tip : tt.value; const hepsi = tg.checked; const a = norm(ta.value);
    const acik = g => hepsi || (tip==="ic" ? ["İç birimler"] : ["Dış kurumlar"]).includes(g);
    m.querySelectorAll("#tp label").forEach(l => l.hidden = !(acik(l.dataset.gr) && norm(l.textContent).includes(a)) && !l.querySelector("input").checked);
    m.querySelectorAll("#tp .g").forEach(g => g.hidden = !acik(g.dataset.g)); };
  const ytSec = () => { const tip = mevcut ? mevcut.tip : tt.value; m.querySelector("#yt").value = tip==="dis" ? "dis" : "ic"; };
  if(tt) tt.onchange = () => { suz(); ytSec(); }; tg.onchange = suz; ta.oninput = suz; suz(); ytSec();
  m.querySelector("#yekle").onclick = async () => {
    const ad = m.querySelector("#ya").value.trim(), kisa = m.querySelector("#yk").value.trim(), tur = m.querySelector("#yt").value;
    if(!ad) return toast("Adı yazın.");
    try{ let key;
      if(tur==="hukukcu"){ const h = Object.values(S.hukukcular).find(x=>norm(x.ad)===norm(ad)); if(h) key="h:"+h.id; else { const r = await addDoc(collection(db,"hukukcular"),{ad}); S.hukukcular[r.id]={id:r.id,ad}; key="h:"+r.id; } kaynak.push({key, ad, kisa:"", grup:"Hukukçular"}); }
      else { const b = await birimBulYaDaEkle(ad, kisa, tur); key=b.id; if(!kaynak.find(x=>x.key===key)) kaynak.push({key, ad:b.ad, kisa:b.kisaltma||"", grup:b.tur==="dis"?"Dış kurumlar":"İç birimler"}); }
      const isaretli = new Set([...m.querySelectorAll("#tp input:checked")].map(x=>x.value)); isaretli.add(key);
      m.querySelector("#tp").innerHTML = liste(); m.querySelectorAll("#tp input").forEach(x => { if(isaretli.has(x.value)) x.checked = true; });
      m.querySelector("#ya").value=""; m.querySelector("#yk").value=""; suz(); toast(`${ad} eklendi ve işaretlendi`);
    }catch(x){ hata(x); } };
  m.querySelector("[data-k]").onclick=kapat;
  m.querySelector("[data-ok]").onclick = async () => {
    const keys = [...m.querySelectorAll("#tp input:checked:not(:disabled)")].map(x=>x.value);
    if(!keys.length) return toast("En az bir yer işaretleyin.");
    const yeniBirimler = keys.map(k => { const x = kaynak.find(y=>y.key===k); return { key:k, ad:x.ad, kisa:x.kisa||"", sonuc:null, barkod:"", tarih:"", ekSure:"" }; });
    let turlar, olay;
    if(mevcut){ turlar = d.turlar.map(t => t.id!==mevcut.id ? t : { ...t, birimler:[...t.birimler, ...yeniBirimler] }); olay = `Görüş turuna eklendi: ${yeniBirimler.map(b=>b.kisa||b.ad).join(", ")}`; }
    else { const v = fd(m); if(!v.barkod.trim() || !v.son) return toast("Barkod ve son tarih gerekli.");
      turlar = [...(d.turlar||[]), { id:uid(), tip:v.tip, barkod:v.barkod.trim(), tarih:v.tarih, sonTarih:v.son, birimler:yeniBirimler }];
      olay = `${v.tip==="dis"?"Dış":"İç"} görüşe açıldı (${v.barkod.trim()}), ${yeniBirimler.length} yer, son tarih ${tarih(v.son)}`; }
    try{ await dosyaGuncelle(d, { turlar }, olay); kapat(); toast("Kaydedildi"); }catch(x){ hata(x); }
  };
}

/* ---------- YENİ DOSYA / DÜZENLE ---------- */
function onEk(k, y){ return k==="A1"?`${y}/A1-`:k==="A2"?`${y}/A2-`:`${y}/${k}`; }
function sonrakiNo(k){
  const y = new Date().getFullYear(); const on = onEk(k,y); let max = S.sayac[`${y}-${k}`]||0;
  Object.values(tumDosyalar()).forEach(d => { if(d.dosyaNo?.startsWith(on)){ const n = parseInt(d.dosyaNo.slice(on.length)); if(n>max) max=n; } });
  return on + (max+1);
}
function vYeni(m){ if(!isMgr()){ m.innerHTML=`<div class="empty">Dosya açma yetkiniz yok.</div>`; return; } dosyaFormu(null, m); }
function dosyaFormu(d, hedef){
  const yeni = !d; d = d || { kategori:"A1", gelisTarihi:bugun(), destekHukukcular:[] };
  const html = `<h1 style="${yeni?"":"font-size:20px"}">${yeni?"Yeni dosya":"Bilgileri düzenle"}</h1>${yeni?`<p class="sub">Dosya atanan uzman yardımcısının sayfasına düşer ve kendisine e-posta gider.</p>`:""}
  <form id="df"><div class="panel">
    <label class="f"><span>Kategori</span><div class="row">${Object.entries(KATS).map(([k,t])=>`<label class="row" style="margin-right:10px"><input type="radio" name="kategori" value="${k}" ${d.kategori===k?"checked":""}> <span class="kat k-${k}">${k}</span> ${t}</label>`).join("")}</div></label>
    <div class="grid2"><label class="f"><span>Dosya no</span><input type="text" name="dosyaNo" value="${esc(d.dosyaNo||"")}" required><div class="hint">Otomatik geldi, gerekirse değiştirebilirsiniz.</div></label>

    ${yeni?`<label class="f"><span>Destek alınan hukukçular (isteğe bağlı)</span><select name="hukukcu" multiple size="4">${Object.values(S.hukukcular).map(h=>h.ad).sort((a,b)=>a.localeCompare(b,"tr")).map(a=>`<option>${esc(a)}</option>`).join("")}</select><div class="hint">Birden fazla seçmek için Ctrl (Mac'te Cmd) tuşuna basılı tutun. Sonradan dosyadan da eklenebilir.</div></label>`:""}
    <label class="f"><span>Açıklama (isteğe bağlı)</span><textarea name="aciklama">${esc(d.aciklama||"")}</textarea></label>
    ${yeni && gercekSahip() ? `<label class="row" style="margin-bottom:12px;background:#FFF4D6;padding:8px 10px;border-radius:7px"><input type="checkbox" name="deneme" ${S.gercek?"checked":""}> <span><b>Deneme dosyası.</b> Raporlara girmez, numara sayacını ilerletmez, bildirimleri kimseye gitmez, sadece size "[Deneme]" olarak gelir. Ayarlar > Veri aktarımı'ndan toplu silinebilir.</span></label>` : ""}
    <p class="err" id="fe"></p>
    <div class="row"><button type="submit" class="btn p">${yeni?"Dosyayı aç":"Kaydet"}</button>${yeni?"":`<button type="button" class="btn" data-k>Vazgeç</button>`}</div>
  </div></form>`;
  let kok;
  if(hedef){ hedef.innerHTML = html; kok = hedef; } else { kok = modal(html); kok.style.maxWidth="760px"; kok.querySelector("[data-k]").onclick = kapat; }
  const f = kok.querySelector("#df"), bi = kok.querySelector("#bi"), bk = kok.querySelector("#bk"), bih = kok.querySelector("#bih");
  const katTur = () => { const k = f.kategori.value; return k==="B" ? "dis" : (k==="C" ? "" : "ic"); };
  const dl = () => { kok.querySelector("#bil").innerHTML = birimListesi(katTur()).map(b=>`<option value="${esc(b.ad)}">${esc(b.kisaltma||"")}</option>`).join(""); };
  const eslesme = () => { const b = Object.values(S.birimler).find(x=>norm(x.ad)===norm(bi.value));
    if(b){ if(!bk.value) bk.value = b.kisaltma||""; bih.textContent = ""; } else bih.textContent = bi.value.trim() ? "Listede yok; kaydedince listeye eklenecek." : ""; };
  bi.oninput = eslesme; dl();
  f.querySelectorAll("input[name=kategori]").forEach(r => r.onchange = () => { dl(); if(yeni) f.dosyaNo.value = sonrakiNo(f.kategori.value); });
  if(yeni && !f.dosyaNo.value) f.dosyaNo.value = sonrakiNo(d.kategori);
  f.onsubmit = async e => { e.preventDefault(); const fe = kok.querySelector("#fe"); fe.textContent="";
    const v = Object.fromEntries(new FormData(f).entries());
    const deneme = yeni && v.deneme === "on";
    const no = deneme ? `DENEME-${Date.now().toString(36).toUpperCase()}` : v.dosyaNo.trim(); if(!no || !v.ad.trim()) { fe.textContent="Dosya no ve ad gerekli."; return; }
    try{
      if(no !== d.dosyaNo){ const q = await getDocs(query(collection(db,"dosyalar"), where("dosyaNo","==",no)));
        if(!q.empty){ fe.textContent = `${no} numarası başka bir dosyada kullanılıyor. Farklı bir numara girin.`; return; } }
      let birim = null;
      if(v.birim.trim()){ const tur = katTur() || (Object.values(S.birimler).find(x=>norm(x.ad)===norm(v.birim))?.tur) || "ic";
        birim = await birimBulYaDaEkle(v.birim, v.kisa, tur);

      const veri = { kategori:v.kategori, dosyaNo:no, ad:v.ad.trim(), tur:v.tur.trim(), birimId:birim?.id||"", birimAd:birim?.ad||"",
        gelisTarihi:v.gelisTarihi, gelisBarkod:v.gelisBarkod.trim(), cevapSonTarih:v.cevapSonTarih, aciklama:v.aciklama.trim() };
      const y = new Date().getFullYear(), on = onEk(v.kategori, y);
      if(!deneme && no.startsWith(on)){ const n = parseInt(no.slice(on.length)); if(n > (S.sayac[`${y}-${v.kategori}`]||0)) await setDoc(doc(db,"sayaclar",`${y}-${v.kategori}`), { son:n }); }
      if(yeni){
        const hk = [...f.querySelectorAll("select[name=hukukcu] option:checked")].map(o=>o.value);
        const ref = await addDoc(collection(db,"dosyalar"), { ...veri, atananEmail:v.atanan||"", sorumluAd:v.atanan?userName(v.atanan):"", destekHukukcular:hk,
          durum:"devam", beklemeGerekce:"", cb:{isaret:false}, raporGizle:false, sonuc:null, onay:{}, raporDuzeltme:null, turlar:[], adimlar:[],
          gecmis:[{ zaman:simdi(), kim:myName(), olay:`Dosya açıldı${v.atanan?`, ${userName(v.atanan)} kişisine atandı`:""}` }], eskiKayit:false, deneme,
          olusturan:S.email, olusturma:serverTimestamp(), guncelleme:serverTimestamp() });
        if(deneme) S.denemeYeni = ref.id;
        if(v.atanan) await bildir([v.atanan], "Size yeni bir dosya atandı", `${no} – ${veri.ad}`, ref.id);
        toast("Dosya açıldı"); location.hash = "#/dosya/"+ref.id;
      } else { await dosyaGuncelle(d, veri, "Dosya bilgileri düzenlendi"); kapat(); toast("Kaydedildi"); }
    }catch(x){ hata(x); }
  };
}

function raporBolumleri(dosyalar, haftalik){
  const srt = l => l.sort((a,b)=>(a.gelisTarihi||"").localeCompare(b.gelisTarihi||""));
  const g = k => srt(dosyalar.filter(GRUP[k]));
  const b = [
    { baslik:"ÇALIŞILAN TASLAKLAR", l:g("calisilan"), cols:["Sıra No","Mevzuat adı","Açıklamalar","Beklenen İşlem"] },
    { baslik:"BEKLEMEDE OLAN TASLAKLAR", l:g("beklemede"), cols:["Sıra No","Mevzuat adı","Hangi aşamada olduğu","Beklenen İşlem"] },
    { baslik:"CUMHURBAŞKANLIĞINA GÖNDERİLEN TASLAKLAR", l:g("cb"), cols:["Sıra No","Mevzuat adı","Hangi aşamada olduğu"], cb:true }
  ];
  const yur = g("yururlukte");
  if(yur.length && !haftalik) b.push({ baslik:"YÜRÜRLÜĞE KONULAN TASLAKLAR", l:yur, cols:["Sıra No","Mevzuat adı","Açıklamalar","Beklenen İşlem"] });
  return b;
}
function cbAsama(d){ const ev = olaylar(d); const son = ev[ev.length-1]; const rm = raporMetni(d);
  if(rm.duzeltildi) return rm.aciklama; return son.tip==="cb" ? "Raportör incelemesinde." : olayMetni(d, son).a; }
function kisa(d){ return S.birimler[d.birimId]?.kisaltma || d.birimAd || ""; }

function onizleme(bolumler, duzenlenebilir){
  return bolumler.map(bl => `<h3>${esc(bl.baslik)} (${bl.l.length} Taslak)</h3>
    ${bl.l.length ? `<div class="scroll"><table class="t"><thead><tr>${bl.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${bl.l.map((d,i)=>{ const rm = raporMetni(d); const e = duzenlenebilir && canWork(d);
      const hucre = (alan, deger) => `<td class="${rm.duzeltildi?"edited":""}"><div class="edit" ${e?`contenteditable="plaintext-only" data-id="${d.id}" data-alan="${alan}"`:""}>${esc(deger).replace(/\n/g,"<br>")}</div></td>`;
      return `<tr><td class="n">${i+1}</td><td><a href="#/dosya/${d.id}">${esc(d.ad)}</a> <b>(${esc(kisa(d))})</b></td>
      ${bl.cb ? hucre("aciklama", cbAsama(d)) : hucre("aciklama", rm.aciklama)+hucre("beklenen", rm.beklenen)}</tr>`; }).join("")}</tbody></table></div>` : `<p class="sub">Yok.</p>`}`).join("");
}
function duzeltmeBagla(m){
  m.querySelectorAll("[data-alan]").forEach(el => {
    const ilk = el.innerText;
    el.onblur = async () => { const yeni = el.innerText.trim(); if(yeni === ilk.trim()) return;
      const d = dosyaBul(el.dataset.id); const rm = raporMetni(d);
      const rd = { aciklama:rm.aciklama, beklenen:rm.beklenen, anahtar:olayAnahtar(d) }; rd[el.dataset.alan] = yeni;
      if(d.cb?.isaret && el.dataset.alan==="aciklama") rd.aciklama = yeni;
      try{ await dosyaGuncelle(d, { raporDuzeltme:rd }, "Rapor metni elle düzeltildi"); el.closest("td").classList.add("edited"); toast("Düzeltme kaydedildi"); }catch(x){ hata(x); } };
  });
}
function rHaftalik(m){
  const l = Object.values(S.dosyalar).filter(d=>d.kategori==="A1" && !d.raporGizle && !d.deneme);
  const gizli = Object.values(S.dosyalar).filter(d=>d.kategori==="A1" && d.raporGizle && !d.deneme);

    ${gizli.length?`<p class="panel" style="padding:10px 14px">${gizli.length} dosya rapora dahil edilmedi: ${gizli.map(d=>`<a href="#/dosya/${d.id}">${esc(d.ad.slice(0,60))}</a>`).join(", ")}</p>`:""}
    <div class="row" style="margin:10px 0"><button class="btn p" id="indir">Word olarak indir</button></div>
    <div id="on">${onizleme(bol, true)}</div>`;
  duzeltmeBagla(m);
  m.querySelector("#indir").onclick = () => { const b = raporBolumleri(Object.values(S.dosyalar).filter(d=>d.kategori==="A1" && !d.raporGizle && !d.deneme), true);

    wordIndir([ baslikP("BAKANLIK MEVZUAT TASLAKLARI"), baslikP(`(Toplam ${t} Taslak)`), ...b.flatMap(bolumDocx) ],
      `Mevzuat Daire Başkanlığı - Günlük Tablo (${n.getDate()}.${n.getMonth()+1}.${n.getFullYear()} ${pad(n.getHours())}.${pad(n.getMinutes())}).docx`); };
}
async function rGenel(m, r){

    wordIndir(govde, `Genel Durum Raporu (${n.getDate()}.${n.getMonth()+1}.${n.getFullYear()}).docx`); };

async function rDonem(m, r){
  const y = new Date().getFullYear(); const bas = r.q.b || `${y}-01-01`, bit = r.q.s || bugun(); const katlar = r.q.k ? r.q.k.split(",") : Object.keys(KATS);
  m.innerHTML = `<p><a href="#/raporlar">← Raporlar</a></p><h1>Dönemsel sayılar</h1><div class="empty">Arşiv yükleniyor…</div>`;
  try{ await arsivYukle(); }catch(e){ hata(e); return; }
  const tum = Object.values(tumDosyalar()).filter(d=>!d.deneme && katlar.includes(d.kategori));
  const gelen = tum.filter(d => d.gelisTarihi && d.gelisTarihi>=bas && d.gelisTarihi<=bit);
  const yur = tum.filter(d => d.sonuc?.tur==="Yürürlüğe girdi" && d.sonuc.tarih>=bas && d.sonuc.tarih<=bit);
  const kapanan = tum.filter(d => d.durum==="arsiv" && (d.sonuc?.tarih||d.arsivTarihi||"")>=bas && (d.sonuc?.tarih||d.arsivTarihi||"")<=bit);

/* Word */
function baslikP(t){ return new docx.Paragraph({ alignment:docx.AlignmentType.CENTER, spacing:{after:80}, children:[new docx.TextRun({ text:t, bold:true, size:26 })] }); }
function hucreP(metin, opt={}){ return String(metin||"").split("\n").map(s => new docx.Paragraph({ spacing:{after:40}, children:[ new docx.TextRun({ text:s, bold:!!opt.bold, size:20 }) ] })); }
function bolumDocx(bl){
  const out = [ new docx.Paragraph({ bullet:{level:0}, spacing:{before:240, after:120}, children:[ new docx.TextRun({ text:`${bl.baslik} (${bl.l.length} Taslak)`, bold:true, size:22 }) ] }) ];
  if(!bl.l.length) return out;
  const gen = bl.cb ? [8,44,48] : [7,33,30,30];
  const hucre = (children, w, bas) => new docx.TableCell({ width:{size:w, type:docx.WidthType.PERCENTAGE}, shading: bas?{fill:"D9E2EA"}:undefined, children });
  const satirlar = [ new docx.TableRow({ tableHeader:true, children: bl.cols.map((c,i)=>hucre(hucreP(c,{bold:true}), gen[i], true)) }) ];
  bl.l.forEach((d,i) => { const rm = raporMetni(d);
    const ad = [ new docx.Paragraph({ children:[ new docx.TextRun({ text:d.ad+" ", size:20 }), new docx.TextRun({ text:`(${kisa(d)})`, bold:true, size:20 }) ] }) ];
    const hs = [ hucre(hucreP(String(i+1)), gen[0]), hucre(ad, gen[1]) ];
    if(bl.cb) hs.push(hucre(hucreP(cbAsama(d)), gen[2])); else hs.push(hucre(hucreP(rm.aciklama), gen[2]), hucre(hucreP(rm.beklenen), gen[3]));
    satirlar.push(new docx.TableRow({ children:hs })); });
  out.push(new docx.Table({ width:{size:100, type:docx.WidthType.PERCENTAGE}, rows:satirlar }));
  return out;
}
async function wordIndir(children, ad){
  if(!window.docx){ toast("Word kütüphanesi yüklenemedi. Sayfayı yenileyip tekrar deneyin."); return; }
  const d = new docx.Document({ styles:{ default:{ document:{ run:{ font:"Times New Roman" } } } },
    sections:[{ properties:{ page:{ margin:{ top:1000, bottom:1000, left:1000, right:1000 } } }, children }] });
  indir(await docx.Packer.toBlob(d), ad);
}
function indir(blob, ad){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = ad; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

function turOner(v, liste){
  const n = norm(v).replace(/[()&]/g," ").replace(/\s+/g," ").trim();
  const var_ = liste.find(t => norm(t) === n); if(var_) return { t:var_, emin:true };
  const on = /ÇERÇEVE|DEĞİŞİKLİK/.test(n) ? "Çerçeve" : (/MÜSTAKİL/.test(n) ? "Müstakil" : "");
  const bul = ad => liste.find(t => norm(t) === norm(ad));
  const tabanlar = [["KANUN","Kanun",false],["CBK|KARARNAME","Cumhurbaşkanlığı Kararnamesi",true],["CB KARAR|CUMHURBAŞKANI KARAR|KARAR","Cumhurbaşkanı Kararı",true],
    ["YÖNETMEL","Yönetmelik",true],["TEBLİĞ","Tebliğ",true],["YÖNERGE","Yönerge",true],["USUL","Usul ve Esaslar",true],["GENELGE","Genelge",false],
    ["PROTOKOL","Protokol",false],["STANDART","Standart",false],["REHBER","Rehber",false],["KILAVUZ","Kılavuz",false],["\\bPLAN","Eylem Planı",false]];
  const eslesen = tabanlar.filter(([k]) => new RegExp(k).test(n.replace("CUMHURBAŞKANLIĞI YÖNETMEL","YÖNETMEL")));
  const ilk = eslesen[0];
  if(!ilk) return { t: bul("Diğer") || "", emin:false };
  if(/İLGA/.test(n)){ const il = bul(`${ilk[1]} İlgası`); if(il) return { t:il, emin: eslesen.length===1 }; }
  const aday = ilk[2] ? bul(`${on||"Müstakil"} ${ilk[1]}`) : bul(ilk[1]);
  return { t: aday || bul("Diğer") || "", emin: eslesen.length===1 && (!ilk[2] || !!on) };
}
async function turEslestir(out){
  out.dataset.aracAktif = "1";
  out.textContent = "Dosyalar taranıyor…";
  try{ await arsivYukle(true); }catch(x){ hata(x); return; }

  const degerler = Object.keys(grup).sort((a,b)=>a.localeCompare(b,"tr"));
  if(!degerler.length){ out.innerHTML = `<p class="sub">Tüm dosyaların türü listede. Yapılacak bir şey yok.</p>`; return; }
  const secenek = (sec, bos) => (bos?`<option value="">Yukarıdaki seçimle aynı</option>`:"") + liste.map(t=>`<option ${t===sec?"selected":""}>${esc(t)}</option>`).join("");
  out.innerHTML = `<p class="hint">Bir satırdaki "Dosyalar" düğmesiyle o türdeki dosyaları görebilir, gerekirse tek tek farklı tür seçebilirsiniz. "Aç" bağlantısı dosyayı yeni sekmede açar.</p>
    <div class="scroll"><table class="t"><thead><tr><th>Dosyalardaki tür</th><th class="n">Dosya</th><th>Yeni tür</th><th></th></tr></thead><tbody>

async function hukukcuDuzenle(out){
  out.dataset.aracAktif = "1";
  out.textContent = "Dosyalar taranıyor…";
  try{ await arsivYukle(true); }catch(x){ hata(x); return; }
  const ekip = {}; Object.values(S.users).forEach(u => ekip[norm(u.ad)] = u);
  const BK = /\(\s*(\d{6,})\s*(?:\/\s*([+\-]))?\s*\)/g;
  const temiz = a => String(a||"").replace(BK,"").replace(/\s+/g," ").trim();
  const barkodlar = a => [...String(a||"").matchAll(BK)].map(m => ({ bk:m[1], s:m[2]||"" }));
  const cop = a => { const t = temiz(a); return !t || !/^[A-ZÇĞİÖŞÜ]/.test(t); };
  const bkYazi = l => l.map(x => `(${x.bk}${x.s?"/"+x.s:""})`).join(" ");
  // 1) liste
  const listeIslem = [];
  const mevcut = new Set(Object.values(S.hukukcular).map(h => norm(h.ad)));
  Object.values(S.hukukcular).forEach(h => {
    const t = temiz(h.ad);
    if(ekip[norm(t)]) listeIslem.push([h, "Ekip üyesi, listeden çıkarılacak", "sil"]);
    else if(!t) listeIslem.push([h, "Sadece barkod, listeden çıkarılacak", "sil"]);
    else if(cop(h.ad)) listeIslem.push([h, "Ad değil, listeden çıkarılacak", "sil"]);
    else if(t !== h.ad) listeIslem.push([h, mevcut.has(norm(t)) ? `"${t}" zaten listede, bu kayıt çıkarılacak` : `Ad "${t}" olarak düzeltilecek`, mevcut.has(norm(t)) ? "sil" : "ad", t]);
  });
  // 2) dosyalar
  const yamalar = []; let atanan = 0, tasinan = 0, notlu = 0; const eklenecekHukukcu = new Set();
  Object.values(tumDosyalar()).forEach(d => {
    const notlar = []; const patch = {};
    let atananEmail = d.atananEmail || "", sorumluAd = d.sorumluAd || "";
    const destek = [];
    if(sorumluAd && !atananEmail && !ekip[norm(sorumluAd)]){ destek.push(temiz(sorumluAd)); eklenecekHukukcu.add(temiz(sorumluAd)); sorumluAd = ""; tasinan++; }
    let onceki = "";
    (d.destekHukukcular||[]).forEach(a => {
      const t = temiz(a), bl = barkodlar(a), u = ekip[norm(t)];
      if(u){ if(!atananEmail && u.rol==="uzman"){ atananEmail = u.email; sorumluAd = u.ad; atanan++; }
             else if(u.email !== atananEmail) notlar.push(`Excel'de birlikte çalışan olarak geçiyor: ${u.ad}`); return; }
      if(!t){ notlar.push(`Destek alınan hukukçu alanındaki barkod: ${onceki?onceki+" ":""}${bkYazi(bl)}`); return; }
      if(cop(a)){ notlar.push(`Destek alınan hukukçu alanındaki not: ${a}`); return; }
      if(bl.length) notlar.push(`${t} ${bkYazi(bl)}`);
      destek.push(t); onceki = t;
    });
    const yeniDestek = [...new Set(destek.filter(Boolean))];
    if(atananEmail !== (d.atananEmail||"")){ patch.atananEmail = atananEmail; }
    if(sorumluAd !== (d.sorumluAd||"")) patch.sorumluAd = sorumluAd;
    if(yeniDestek.join("|") !== (d.destekHukukcular||[]).join("|")) patch.destekHukukcular = yeniDestek;
    let tdeg = false;
    const turlar = (d.turlar||[]).map(t => { const yeni = [];
      (t.birimler||[]).forEach(b => {
        if(!String(b.key).startsWith("h:")) { yeni.push(b); return; }
        const ad = temiz(b.ad), bl = barkodlar(b.ad);
        if(!ad && bl.length){ const o = yeni[yeni.length-1]; tdeg = true;
          if(o && !o.sonuc){ yeni[yeni.length-1] = { ...o, sonuc:bl[0].s || "?", barkod:bl[0].bk }; } else notlar.push(`Görüş turundaki barkod: ${bkYazi(bl)}`); return; }
        if(ad !== b.ad){ tdeg = true; yeni.push({ ...b, ad, ...(b.sonuc || !bl.length ? {} : { sonuc:bl[0].s || "?", barkod:bl[0].bk }) }); return; }
        yeni.push(b); });
      return { ...t, birimler:yeni }; });
    if(tdeg) patch.turlar = turlar;
    if(notlar.length){ patch.eskiBilgi = (d.eskiBilgi ? d.eskiBilgi+"\n\n" : "") + "Kayıt temizliğinde taşınan bilgiler:\n" + notlar.join("\n"); notlu++; }
    if(Object.keys(patch).length) yamalar.push([d, patch]);
  });
  const yeniHukukcu = [...eklenecekHukukcu].filter(a => a && !mevcut.has(norm(a)) && !cop(a));
  if(!listeIslem.length && !yamalar.length){ out.innerHTML = `<p class="sub">Düzeltilecek kayıt bulunamadı.</p>`; return; }
  out.innerHTML = `${listeIslem.length?`<table class="t" style="margin-bottom:10px"><thead><tr><th>Listedeki kayıt</th><th>Yapılacak</th></tr></thead><tbody>${listeIslem.map(([h,n])=>`<tr><td>${esc(h.ad)}</td><td>${esc(n)}</td></tr>`).join("")}</tbody></table>`:""}
    <p>${yamalar.length} dosya güncellenecek: ${atanan} dosya ekipteki sorumlusuna atanacak, ${tasinan} dosyada ekip dışındaki sorumlu "destek alınan hukukçu" alanına taşınacak, ${notlu} dosyada barkod ve notlar "Eski kayıttan aktarılan bilgiler" bölümüne eklenecek.${yeniHukukcu.length?` Hukukçu listesine ${yeniHukukcu.length} kişi eklenecek.`:""}</p>
    <button class="btn p" id="hduy">Onayla ve uygula</button>`;
  out.querySelector("#hduy").onclick = async () => { out.querySelector("#hduy").disabled = true;
    try{
      for(let i=0;i<yamalar.length;i+=400){ const bt = writeBatch(db); yamalar.slice(i,i+400).forEach(([d,p]) => bt.update(doc(db,"dosyalar",d.id), p)); await bt.commit(); }
      for(const [h,,islem,yeni] of listeIslem){ if(islem==="sil") await deleteDoc(doc(db,"hukukcular",h.id)); else await updateDoc(doc(db,"hukukcular",h.id), { ad:yeni, eskiAdlar:[...new Set([...(h.eskiAdlar||[]), h.ad])] }); }
      for(const a of yeniHukukcu) await addDoc(collection(db,"hukukcular"), { ad:a });
      S.arsiv = null; delete out.dataset.aracAktif; toast(`Tamamlandı: ${yamalar.length} dosya güncellendi, ${listeIslem.length} liste kaydı düzeltildi`);
    }catch(x){ hata(x); } };
}
async function hukukcuTemizle(out){

  const hedef = {}, adHedef = {}, silinecek = [], eskiGuncelle = [];
  Object.values(gruplar).forEach(g => {
    const kalan = g[0]; const eskiler = new Set(kalan.eskiAdlar||[]);
    g.forEach(h => { hedef[h.id] = kalan; adHedef[norm(h.ad)] = kalan.ad; (h.eskiAdlar||[]).forEach(a => { adHedef[norm(a)] = kalan.ad; eskiler.add(a); });
      if(h.id!==kalan.id){ silinecek.push(h); eskiler.add(h.ad); } });

    if(yeni.join("|") !== dh.join("|")) patch.destekHukukcular = yeni;

      if(!String(b.key).startsWith("h:")) return b;
      const x = hedef[b.key.slice(2)]; const ad = x ? x.ad : (adHedef[norm(b.ad)] || b.ad); const key = x ? "h:"+x.id : b.key;
      if(key!==b.key || ad!==b.ad){ degisti = true; return { ...b, key, ad }; } return b; }) }));
    if(degisti) patch.turlar = turlar;
    if(Object.keys(patch).length) yamalar.push([d, patch]);
  });

      for(const [h,e] of eskiGuncelle) await updateDoc(doc(db,"hukukcular",h.id), { eskiAdlar:e });
      for(let i=0;i<silinecek.length;i+=400){ const bt = writeBatch(db); silinecek.slice(i,i+400).forEach(h => bt.delete(doc(db,"hukukcular",h.id))); await bt.commit(); }
      S.arsiv = null; delete out.dataset.aracAktif; toast(`Düzeltmeler uygulandı: ${silinecek.length} hukukçu birleştirildi, ${yamalar.length} dosya güncellendi`);
    }catch(x){ hata(x); } };
}

      for(let i=0;i<silinecek.length;i+=400){ const bt = writeBatch(db); silinecek.slice(i,i+400).forEach(b => bt.delete(doc(db,"birimler",b.id))); await bt.commit(); }

const EPOSTA_YOK = "@eposta-yok.local";

    <div class="panel"><p>Aktarımdan sonra bir kişinin adını düzelttiyseniz ya da yeni kişi eklediyseniz, sorumlusu atanmamış eski dosyaları kişi listesiyle yeniden eşleştirir. Aktif ve arşivdeki dosyalar birlikte taranır.</p>
    <button class="btn" id="se">Eşleşmeleri bul</button><div id="so" style="margin-top:10px"></div></div>`;
  m.querySelector("#dsil").onclick = async () => { const o = m.querySelector("#dso"); o.textContent = "Aranıyor…";
    try{ const dq = await getDocs(query(collection(db,"dosyalar"), where("deneme","==",true)));
      const bq = await getDocs(query(collection(db,"bildirimler"), where("deneme","==",true)));
      if(dq.empty && bq.empty){ o.innerHTML = `<p class="sub">Deneme verisi yok.</p>`; return; }
      o.innerHTML = `<p>${dq.size} deneme dosyası ve ${bq.size} deneme bildirimi silinecek.</p><button class="btn danger" id="dsil2">Sil</button>`;
      o.querySelector("#dsil2").onclick = async () => { if(!confirm("Deneme verileri kalıcı olarak silinsin mi?")) return;
        try{ const hepsi = [...dq.docs, ...bq.docs];
          for(let i=0;i<hepsi.length;i+=400){ const bt = writeBatch(db); hepsi.slice(i,i+400).forEach(x=>bt.delete(x.ref)); await bt.commit(); }
          o.innerHTML = `<p>Silindi.</p>`; toast("Deneme verileri silindi"); }catch(x){ hata(x); } };
    }catch(x){ hata(x); o.textContent=""; } };
  m.querySelector("#se").onclick = async () => {
    const so = m.querySelector("#so"); so.textContent = "Dosyalar taranıyor…";
    try{ await arsivYukle(true); }catch(x){ hata(x); return; }
    const kisiMap = {}; Object.values(S.users).forEach(u => kisiMap[norm(u.ad)] = u.email);
    const bul = Object.values(tumDosyalar()).filter(d => !d.atananEmail && kisiMap[norm(d.sorumluAd)]);
    if(!bul.length){ so.innerHTML = `<p class="sub">Eşleştirilecek dosya bulunamadı. Kişi adının Excel'deki yazımla aynı olduğundan emin olun.</p>`; return; }
    const say = {}; bul.forEach(d => { const e = kisiMap[norm(d.sorumluAd)]; say[e] = (say[e]||0)+1; });
    so.innerHTML = `<table class="t"><tbody>${Object.entries(say).map(([e,n])=>`<tr><td>${esc(userName(e))}</td><td class="n">${n} dosya</td></tr>`).join("")}</tbody></table>
      <p><button class="btn p" id="su">Eşleştir</button></p>`;
    m.querySelector("#su").onclick = async () => { m.querySelector("#su").disabled = true;
      try{ for(let i=0;i<bul.length;i+=400){ const b = writeBatch(db);
          bul.slice(i,i+400).forEach(d => { const e = kisiMap[norm(d.sorumluAd)]; b.update(doc(db,"dosyalar",d.id), { atananEmail:e, sorumluAd:userName(e) }); });
          await b.commit(); }
        S.arsiv = null; so.innerHTML = `<p>${bul.length} dosya eşleştirildi.</p>`; toast("Eşleştirildi");
      }catch(x){ hata(x); m.querySelector("#su").disabled = false; } };
  };
  m.querySelector("#af").onchange = async e => {
    const f = e.target.files[0]; if(!f) return; let v;
    try{ v = JSON.parse(await f.text()); }catch(x){ m.querySelector("#ao").innerHTML = `<p class="err">Dosya okunamadı: ${esc(x.message)}</p>`; return; }
    const kisiMap = {}; Object.values(S.users).forEach(u => kisiMap[norm(u.ad)] = u.email);
    const eslesen = (v.dosyalar||[]).filter(d=>kisiMap[norm(d.sorumluAd)]).length;
    m.querySelector("#ao").innerHTML = `<table class="t"><tbody>
      <tr><td>Dosya</td><td class="n">${(v.dosyalar||[]).length}</td></tr><tr><td>Sorumlusu ekipteki bir kişiyle eşleşen</td><td class="n">${eslesen}</td></tr>
      <tr><td>Birim / kurum</td><td class="n">${(v.birimler||[]).length}</td></tr><tr><td>Hukukçu</td><td class="n">${(v.hukukcular||[]).length}</td></tr>
      <tr><td>Ek liste / kayıt</td><td class="n">${(v.ekListeler||[]).length} / ${(v.ekKayitlar||[]).length}</td></tr></tbody></table>
      ${Object.keys(S.dosyalar).length?`<p class="err">Veritabanında zaten ${Object.keys(S.dosyalar).length} aktif dosya var. Aktarım bunların üzerine ekleme yapar, aynı dosyalar iki kez oluşabilir.</p>`:""}
      <p><button class="btn p" id="ab">Aktarımı başlat</button></p><p id="ad" class="sub"></p>`;
    m.querySelector("#ab").onclick = async () => {
      if(!confirm("Aktarım başlasın mı?")) return; const ad = m.querySelector("#ad"); m.querySelector("#ab").disabled = true;
      const yaz = async (islemler, etiket) => { for(let i=0;i<islemler.length;i+=400){ const b = writeBatch(db); islemler.slice(i,i+400).forEach(fn=>fn(b)); await b.commit(); ad.textContent = `${etiket}: ${Math.min(i+400,islemler.length)}/${islemler.length}`; } };
      try{
        await yaz((v.birimler||[]).map(x=>b=>b.set(doc(db,"birimler",x.id), { ad:x.ad, kisaltma:x.kisaltma||"", tur:x.tur||"ic" })), "Birimler");
        await yaz((v.hukukcular||[]).map(x=>b=>b.set(doc(collection(db,"hukukcular")), { ad:x.ad })), "Hukukçular");
        if(v.turler?.length) await setDoc(doc(db,"ayarlar","genel"), { turler:[...new Set([...S.turler, ...v.turler])] }, { merge:true });
        await yaz((v.ekListeler||[]).map(x=>b=>b.set(doc(db,"ekListeler",x.id), { ad:x.ad, sutunlar:x.sutunlar, salt:!!x.salt, sira:x.sira||0 })), "Listeler");
        await yaz((v.ekKayitlar||[]).map(x=>b=>b.set(doc(collection(db,"ekKayitlar")), x)), "Liste kayıtları");
        await yaz((v.dosyalar||[]).map(x=>b=>{ const e = kisiMap[norm(x.sorumluAd)] || ""; const y = { ...x, atananEmail:e, sorumluAd: e ? userName(e) : (x.sorumluAd||""),
          olusturan:S.email, olusturma:serverTimestamp(), guncelleme:serverTimestamp() }; b.set(doc(collection(db,"dosyalar")), y); }), "Dosyalar");
        for(const [k,n] of Object.entries(v.sayaclar||{})) if(n > (S.sayac[k]||0)) await setDoc(doc(db,"sayaclar",k), { son:n });
        S.arsiv = null; ad.textContent = "Aktarım tamamlandı."; toast("Aktarım tamamlandı");
      }catch(x){ hata(x); ad.textContent = "Aktarım yarıda kaldı. Hata ayrıntısı yukarıda."; }
    };
  };
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
